name: api-it-user-net-quality
version: v1
type: workflow
tags:
  - Quality
description: Data quality checks for api-it-user-net
workspace: public
workflow:
  dag:
    - name: api-it-user-net-quality
      title: api-it-user-net Quality Assertion
      description: Data quality checks for api-it-user-net
      spec:
        stack: soda+python:1.0
        logLevel: INFO
        compute: runnable-default
        resources:
          requests:
            cpu: 1000m
            memory: 250Mi
          limits:
            cpu: 1000m
            memory: 250Mi
        stackSpec:
          inputs:
            - dataset: dataos://icebase:builderuploads/api_it_user_net
              options:
                engine: minerva
                clusterName: builder
              checks:
                - row_count > 0:
                    attributes:
                      category: Accuracy
                - missing_count(country_name) = 0:
                    attributes:
                      category: Completeness
