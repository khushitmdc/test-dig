tables:
  - name: api_it_user_net
    title: api_it_user_net
    sql: {{ load_sql('api_it_user_net') }}
    description: Semantic view for api_it_user_net.
    public: true
    dimensions:
      - name: country_name
        type: string
        column: country_name
        description: Country name
        public: true
      - name: country_code
        type: string
        column: country_code
        description: Country code
        public: true
        primary_key: true
      - name: indicator_name
        type: string
        column: indicator_name
        description: Indicator name
        public: true
        meta:
          secure:
            func: redact
            user_groups:
              includes:
                - pii_access
      - name: n_2021
        type: number
        column: n_2021
        description: Year 2021 percentages
        public: true
      - name: n_2022
        type: number
        column: n_2022
        description: Year 2022 percentages
        public: true
      - name: n_2024
        type: number
        column: n_2024
        description: Year 2024 percenatges
        public: true
      - name: n_2023
        type: number
        column: n_2023
        description: year 2023 percenatges
        public: true
      - name: n_2025
        type: number
        column: n_2025
        description: year 2025 percentge
        public: true
      - name: date_column
        type: string
        description: Date column
        public: true
        sql: date_diff('day',current_timestamp,current_timestamp)
    measures:
      - name: total_countries_considered
        type: count
        sql: "{TABLE.country_code}"
        description: Total countries data available and considered
        public: true
      - name: test_measure
        type: sum
        sql: case when country_name in ('Sri Lanka', 'Lesotho') then 1 end
        description: test_measure
        public: true
    joins:
      - name: country_metadata
        relationship: one_to_many
        sql: "{TABLE}.country_code = {country_metadata.country_code}"
      - name: indicator_metadata
        relationship: one_to_many
        sql: "{TABLE}.indicator_code = {indicator_metadata.indicator_code}"
