version: v1alpha
type: lens
tags:
  - Tier.Generated
  - SemanticModelAgent
layer: user
workspace: public
lens:
  compute: runnable-default
  secrets:
    - name: global-digitisation-view-lens
      allKeys: true
  source:
    type: minerva
    name: builder
    catalog: icebase
  repo:
    url: https://github.com/khushitmdc/test-dig
    lensBaseDir: test-dig/cadp/model
    syncFlags:
      - --ref=main
  api:
    logLevel: info
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi
  router:
    logLevel: info
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi
    envs:
      LENS2_DB_TIMEOUT: "1500000"
      LENS2_SCHEDULED_REFRESH_TIMEZONES: UTC,America/Vancouver,America/Toronto
      LENS2_SOURCE_CATALOG_NAME: icebase   
      MINERVA_TCP_HOST: gateway.network-gateway.svc.cluster.local
      MINERVA_TCP_PORT: 17432
  worker:
    logLevel: info
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 512Mi
name: global-digitisation-view-lens
description: fresh added Lens manifest for Global Digitisation View
